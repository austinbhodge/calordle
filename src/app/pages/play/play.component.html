<div *ngIf="currentFood">
  <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <!-- Food image with name overlay -->
    <div class="relative">
      <img class="w-full h-56 object-cover" [src]="currentFood.imageURI" [alt]="currentFood.name">
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent px-5 pb-4 pt-10">
        <h2 class="text-white text-lg font-semibold">{{ currentFood.name }}</h2>
      </div>
    </div>

    <div class="p-6 space-y-5">
      <!-- Guess tiles -->
      <div class="flex justify-center gap-2">
        <ng-container *ngFor="let guess of guesses">
          <div class="w-16 h-16 rounded-xl flex flex-col items-center justify-center text-xs font-semibold transition-all duration-300 animate-fade-in"
            [ngClass]="{
              'bg-green-100 text-green-800 ring-2 ring-green-300': getGuessIcon(guess) === 'check',
              'bg-red-50 text-red-700 ring-1 ring-red-200': getGuessIcon(guess) === 'arrow-up',
              'bg-amber-50 text-amber-700 ring-1 ring-amber-200': getGuessIcon(guess) === 'arrow-up-close' || getGuessIcon(guess) === 'arrow-down-close',
              'bg-blue-50 text-blue-700 ring-1 ring-blue-200': getGuessIcon(guess) === 'arrow-down'
            }">
            <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath(getGuessIcon(guess))"/>
            </svg>
            <span>{{ guess }}</span>
          </div>
        </ng-container>

        <ng-container *ngFor="let _ of createRange(guessesLeft)">
          <div class="w-16 h-16 rounded-xl border-2 border-dashed border-gray-200"></div>
        </ng-container>
      </div>

      <!-- Hint -->
      <div *ngIf="revealedMacro" class="text-center text-sm bg-muted-green-50 rounded-lg py-2 px-4 text-muted-green-600 animate-fade-in">
        Hint: {{ revealedMacro }}
      </div>

      <!-- Input + submit -->
      <div class="flex gap-3" *ngIf="!gameOver">
        <input
          type="number"
          [(ngModel)]="userGuess"
          (keydown)="onKeydown($event)"
          class="flex-1 rounded-xl border-2 border-muted-green-200 px-4 py-3 text-center text-lg focus:border-muted-green-500 focus:ring-2 focus:ring-muted-green-200 focus:outline-none transition-colors duration-200"
          placeholder="Calories?">
        <button
          (click)="submitGuess()"
          class="rounded-xl bg-muted-green-600 px-6 py-3 text-white font-semibold hover:bg-muted-green-700 active:scale-95 transition-all duration-150">
          Guess
        </button>
      </div>

      <!-- Feedback -->
      <div *ngIf="feedback"
        class="text-center py-3 px-4 rounded-xl text-sm font-medium animate-fade-in"
        [ngClass]="{
          'bg-green-50 text-green-700': gameWon,
          'bg-amber-50 text-amber-700': !gameOver && !gameWon,
          'bg-red-50 text-red-700': gameOver && !gameWon
        }">
        {{ feedback }}
      </div>

      <!-- Game over -->
      <div *ngIf="gameOver" class="text-center space-y-3 animate-fade-in">
        <a [href]="currentFood.sourceURI" target="_blank"
          class="inline-block text-sm text-muted-green-600 hover:text-muted-green-800 underline underline-offset-2 transition-colors">
          View Nutritional Info
        </a>
        <p class="text-xs text-gray-400">Come back tomorrow for a new food!</p>
      </div>
    </div>
  </div>
</div>
